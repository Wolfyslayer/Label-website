name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify asset paths
        run: npm run verify:assets

      - name: Validate content
        run: npm run validate:content

      - name: Sync favicons to public root
        run: npm run sync:icons

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          GITHUB_PAGES: "1"
          NEXT_PUBLIC_STATIC_HOSTING: "1"
          NEXT_PUBLIC_SITE_URL: https://wolfyslayer.online
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
          # Optional: pull CMS content at build time (anon key only — never service role)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify export output
        run: |
          test -f out/CNAME
          test -f out/404.html
          grep -q "Page not found" out/404.html
          test -f out/en/index.html
          test ! -e out/manager/index.html
          test ! -e out/admin/index.html
          test ! -e out/admin/login/index.html
          test -f out/sv/index.html
          test -f out/en/artists/frostmark/index.html
          test -f out/sitemap.xml
          grep -q "wolfyslayer.online" out/sitemap.xml
          test -f out/assets/favicons/favicon.svg
          test -f out/favicon.svg
          ! grep -rq "SERVICE_ROLE" out/ || (echo "Service role leaked in out/" && exit 1)

      - name: Validate SEO export
        env:
          NEXT_PUBLIC_SITE_URL: https://wolfyslayer.online
        run: npm run validate:seo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
