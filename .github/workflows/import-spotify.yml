name: Import Spotify catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spotify-catalog-refresh
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Spotify secrets
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ] || [ -z "$SPOTIFY_CLIENT_SECRET" ]; then
            echo "::error::Missing SPOTIFY_CLIENT_ID or SPOTIFY_CLIENT_SECRET repository secrets."
            exit 1
          fi

      - name: Import catalog from Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: npm run import:spotify

      - name: Enrich verified YouTube Music track links
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            npm run import:youtube-music
          else
            echo "::warning::YOUTUBE_API_KEY missing; skipping YouTube Music enrichment."
          fi

      - name: Match missing YouTube Music tracks and create review report
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_SEARCH_LIMIT: "70"
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            npm run auto-match:youtube-music
          else
            echo "::warning::YOUTUBE_API_KEY missing; skipping automatic candidate search."
          fi

      - name: Upload YouTube Music review report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-music-auto-review
          path: youtube-music-auto-review.md
          if-no-files-found: ignore

      - name: Validate content
        run: npm run validate:content

      - name: Spotify importer tests
        run: npm run test:spotify

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Create pull request
        id: catalog_pr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(content): refresh catalog from Spotify"
          title: "Spotify catalog import"
          body: |
            Automated catalog refresh from Spotify (Client Credentials).

            Automatically imported catalog changes, including unique strict YouTube Music Topic-channel matches. Uncertain matches are only reported in the workflow artifact. The import, content validation, tests, lint, typecheck and build must pass before this PR is created.
            See [docs/SPOTIFY_IMPORT.md](../blob/main/docs/SPOTIFY_IMPORT.md) for details.

            The workflow automatically merges only allowed catalog JSON updates. Unexpected file changes and deletions require manual review.
          branch: automation/spotify-catalog-import
          delete-branch: true
          labels: |
            content
            spotify

      - name: Merge validated catalog PR
        if: ${{ steps.catalog_pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.catalog_pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          # Only the fixed automation branch may be merged by this workflow.
          head_ref="$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')"
          if [ "$head_ref" != "automation/spotify-catalog-import" ]; then
            echo "::error::Unexpected PR head: $head_ref"
            exit 1
          fi
          # Fail closed: do not merge edits outside the generated catalog or deletions.
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[] | [.filename, .status] | @tsv')"
          if [ -z "$files" ]; then
            echo "No changed files; skipping merge."
            exit 0
          fi
          while IFS=$'\t' read -r path status; do
            case "$path" in
              content/releases/*.json|content/tracks/*.json|content/site.json) ;;
              *) echo "::error::Unexpected changed file: $path"; exit 1 ;;
            esac
            if [ "$status" = "removed" ]; then
              echo "::error::Deletion requires manual review: $path"
              exit 1
            fi
          done <<< "$files"
          gh pr merge "$PR_NUMBER" --squash --delete-branch
