name: Test Soundcharts UPC lookup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soundcharts-upc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Export Spotify UPCs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: npx tsx scripts/export-spotify-identifiers.ts
      - name: Test three UPCs with Soundcharts
        env:
          SOUNDCHARTS_CLIENT_ID: ${{ secrets.SOUNDCHARTS_CLIENT_ID }}
          SOUNDCHARTS_CLIENT_SECRET: ${{ secrets.SOUNDCHARTS_CLIENT_SECRET }}
        run: npx tsx scripts/test-soundcharts-upc.ts
      - name: Upload read-only diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundcharts-upc-report
          path: soundcharts-upc-report.md
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary identifiers
        if: always()
        run: rm -f spotify-identifiers.csv soundcharts-upc-report.md
