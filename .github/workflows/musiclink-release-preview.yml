name: MusicLink release conversion preview
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Releases to try (1-20)
        default: '3'
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Convert Spotify release URLs with MusicLink
        env:
          MUSICLINK_API_KEY: ${{ secrets.MUSICLINK_API_KEY }}
          MUSICLINK_RELEASE_LIMIT: ${{ inputs.limit }}
        run: npx tsx scripts/preview-musiclink-release-links.ts
      - uses: actions/upload-artifact@v4
        with:
          name: musiclink-release-preview
          path: |
            musiclink-release-preview.md
            musiclink-release-candidates.json
          retention-days: 30
