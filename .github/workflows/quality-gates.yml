name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types, assets and static export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint and typecheck
        run: npm run check:quality
      - name: Verify official assets
        run: npm run verify:assets
      - name: Build GitHub Pages export
        run: npm run build:pages
      - name: Validate SEO and exported files
        run: npm run validate:seo
      - name: Verify exported links and resources
        run: npm run verify:export
      - name: Report static asset size budgets
        run: npm run check:performance
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-budget-report
          path: test-results/performance/budget-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload export for debugging on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-export-debug
          path: |
            out/
            .next/
            test-results/export-integrity.json
          if-no-files-found: ignore
          retention-days: 3

  browser-smoke:
    name: Mobile and keyboard smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile and keyboard smoke tests
        run: npx playwright test tests/e2e/quality-smoke.spec.ts tests/e2e/accessibility-basics.spec.ts
      - name: Collect mobile vitals diagnostics
        continue-on-error: true
        run: npx playwright test tests/e2e/vitals-diagnostics.spec.ts
      - name: Upload mobile vitals diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-vitals-diagnostics
          path: test-results/vitals/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-debug
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
