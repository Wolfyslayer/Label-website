name: MusicLink full catalog discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: musiclink-full-catalog
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore previous progress artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=musiclink-full-catalog-progress&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > progress.zip
            unzip -o -q progress.zip 'musiclink-release-progress.json'
          fi
      - name: Discover all remaining links
        env:
          MUSICLINK_API_KEY: ${{ secrets.MUSICLINK_API_KEY }}
          MUSICLINK_RELEASE_LIMIT: '500'
        run: npx tsx scripts/discover-all-musiclink-releases.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musiclink-full-catalog-progress
          path: |
            musiclink-release-progress.json
            musiclink-release-candidates.json
            musiclink-release-preview.md
          retention-days: 90
