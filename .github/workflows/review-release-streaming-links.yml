name: Review release streaming candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate candidate release identities without changing catalog
        run: npx tsx scripts/review-release-streaming-candidates.ts
      - uses: actions/upload-artifact@v4
        with:
          name: release-streaming-review
          path: release-streaming-review.md
          retention-days: 30
