name: Deploy Wolfyslayer Records to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build static website
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run build
          elif [ -f yarn.lock ]; then
            yarn build
          else
            npm run build
          fi

      - name: Locate static build and set custom domain
        shell: bash
        run: |
          if [ -d out ]; then
            SITE_DIR=out
          elif [ -d dist ]; then
            SITE_DIR=dist
          elif [ -d build ]; then
            SITE_DIR=build
          else
            echo 'No static output directory found (expected out/, dist/, or build/). Configure Next.js output: export or your bundler build.' >&2
            exit 1
          fi
          echo 'wolfyslayer.online' > "$SITE_DIR/CNAME"
          touch "$SITE_DIR/.nojekyll"
          echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
